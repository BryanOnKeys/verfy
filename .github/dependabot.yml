version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      next-react:
        patterns: ["next", "react", "react-dom", "eslint-config-next", "@types/react*"]
      supabase:
        patterns: ["@supabase/*"]
  - package-ecosystem: pip
    directory: /verfy-cli
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
