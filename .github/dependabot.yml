version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # typescript-eslint does not support TypeScript 7 yet
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # types for the Node.js major we run (24), not the newest one
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      next-react:
        patterns: ["next", "react", "react-dom", "eslint-config-next", "@types/react*"]
      supabase:
        patterns: ["@supabase/*"]
  - package-ecosystem: pip
    directory: /verfy-cli
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /.github/requirements
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
