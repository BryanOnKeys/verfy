name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web app, database and shared engine
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit, API helper and database (RLS) tests
        run: npm test
      - name: Shared engine fixtures (JS)
        run: npm run test:engine
      - name: Advisories are valid and the migration is up to date
        run: node scripts/advisories.mjs
      - name: No old product names
        run: npm run check:brand
      - name: Production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: No secrets in the repository or the browser bundle
        run: npm run check:secrets

  cli:
    name: Verfy CLI (Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.12", "3.13"]
        include:
          - os: windows-latest
            python: "3.13"
          - os: macos-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Tests (pure-Python Ed25519)
        working-directory: verfy-cli
        env:
          VERFY_PURE_PYTHON: "1"
        run: python -m unittest discover -s tests -v
      - name: Install and smoke test
        run: |
          python -m pip install ./verfy-cli
          verfy --version
          verfy check "ls -la"
          verfy demo
