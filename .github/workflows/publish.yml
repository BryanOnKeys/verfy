name: Publish CLI to PyPI

# Push a tag cli-vX.Y.Z (matching verfy-cli/src/verfy/__init__.py) to release.
# Uses PyPI Trusted Publishing: no API token is stored anywhere.
on:
  push:
    tags: ["cli-v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test the package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Version matches the tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v=$(python -c "import re,pathlib; print(re.search(r'__version__ = \"(.+?)\"', pathlib.Path('verfy-cli/src/verfy/__init__.py').read_text()).group(1))")
          test "cli-v$v" = "$GITHUB_REF_NAME" || { echo "::error::tag $GITHUB_REF_NAME does not match version $v"; exit 1; }
      - name: Tests
        working-directory: verfy-cli
        run: python -m unittest discover -s tests
      - name: Build
        run: |
          python -m pip install --disable-pip-version-check build twine
          python -m build verfy-cli --outdir dist
          python -m twine check --strict dist/*
      - name: Install the wheel and run it
        run: |
          python -m venv /tmp/try
          /tmp/try/bin/pip install --disable-pip-version-check dist/*.whl
          /tmp/try/bin/verfy --version
          /tmp/try/bin/verfy check "npm test"
          set +e; /tmp/try/bin/verfy check "rm -rf ~"; test $? -eq 2
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: Upload to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/verfy/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          # Sigstore attestations would publish this private repository's name to a public log
          attestations: false
