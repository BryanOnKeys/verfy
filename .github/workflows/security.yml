name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: npm audit (production dependencies, high and critical)
        run: npm audit --omit=dev --audit-level=high
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: pip-audit (CLI and its optional extra)
        run: |
          python -m pip install pip-audit
          python -m pip install "./atls-cli[fast]"
          pip-audit --progress-spinner off

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: TruffleHog (verified secrets only)
        uses: trufflesecurity/trufflehog@v3.99.2
        with:
          extra_args: --only-verified
      - name: Atls pattern scan
        run: node scripts/check-secrets.mjs

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@v4
